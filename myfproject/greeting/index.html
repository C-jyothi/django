<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    <form method="POST">

        {% csrf_token %}

        <p>
            {{ form.email.label_tag }}
            {{ form.email }}

            {% for error in form.email.errors %}
                <span style="color:red;">
                    {{ error }}
                </span>
            {% endfor %}
        </p>

        <p>
            {{ form.password.label_tag }}
            {{ form.password }}

            {% for error in form.password.errors %}
                <span style="color:red;">
                    {{ error }}
                </span>
            {% endfor %}
        </p>

        <button type="submit">Login</button>

    </form>

</body>
</html>
